[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "guard-invariance"
version = "0.1.0"
description = "Paraphrase and cross-lingual invariance of step-level agent guards on TS-Bench (AgentDojo-Traj)"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "pyyaml>=6",
    "numpy>=1.26",
    "scipy>=1.11",
    "requests>=2.31",
]

[project.optional-dependencies]
vertex = [
    "google-genai>=1.20",
    "google-auth>=2.30",
    "google-cloud-translate>=3.15",
    "anthropic[vertex]>=0.40",
]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
guard-invariance = "guard_invariance.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
